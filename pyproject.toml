[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["incidentlens*"]

[tool.setuptools.package-data]
incidentlens = ["static/*"]

[project]
name = "incidentlens"
version = "0.1.0"
description = "Evidence-first incident investigation with hybrid RAG, graphs and guardrails"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1",
  "sentence-transformers>=3,<6", "qdrant-client>=1.14,<2",
  "rank-bm25==0.2.2", "networkx>=3.4,<4",
  "presidio-analyzer>=2.2,<3", "presidio-anonymizer>=2.2,<3",
  "pdfplumber>=0.11,<1",
]
[project.optional-dependencies]
pdf = ["docling>=2.50,<3"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "reportlab>=4,<5"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires downloaded local ML models"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
